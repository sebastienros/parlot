# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # The source generator must load in the compiler of the oldest supported SDK (CS9057),
      # see Directory.Packages.props.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      # Dependencies of the net472 and netstandard2.0 builds: a new major version would raise
      # the minimum version for every consumer, so only take servicing updates.
      - dependency-name: "Microsoft.Bcl.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    groups:
       # Grouped version updates configuration
       all-dependencies:
          patterns:
            - "*"
