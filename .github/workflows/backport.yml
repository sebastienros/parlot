name: Backport PR to branch

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 14 * * *'

permissions: {}

jobs:
  backport:
    if: >-
      github.repository == 'sebastienros/parlot' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/backport to ')))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: dotnet/arcade/.github/workflows/backport-base.yml@0a7384092beac94720dcbf5f8edfcfb95bde2b03
    with:
      repository_owners: 'sebastienros'
      pr_description_template: |
        Backport of #%source_pr_number% to %target_branch%

        /cc %cc_users%
